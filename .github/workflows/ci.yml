name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK (this fork targets Java 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Use the hosted runner's Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept SDK licenses
        run: |
          # yes exits with SIGPIPE after sdkmanager finishes; retain sdkmanager's status.
          set +o pipefail
          yes | sdkmanager --licenses
      - name: Install SDK and NDK
        run: bash scripts/ci-command.sh sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Check dependencies and compile Java before the expensive native build
        run: bash scripts/ci-command.sh ./gradlew :app:checkFdroidJSDebugAarMetadata :app:compileFdroidJSDebugJavaWithJavac --stacktrace
      - name: Cache native libraries
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: Builder/mupdf-1.28.5
          key: native-linux-ndk27-1.28.5-${{ hashFiles('Builder/jni/**', 'Builder/link_to_mupdf_1.28.5.sh', 'Builder/ci-native.sh') }}
      - name: Install native build dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/ci-command.sh sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          bash scripts/ci-command.sh sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y build-essential pkg-config libfreetype-dev libharfbuzz-dev libjpeg-dev libopenjp2-7-dev zlib1g-dev libgumbo-dev libmujs-dev mesa-common-dev libxcursor-dev libxrandr-dev libxinerama-dev libglu1-mesa-dev libxi-dev libgl-dev
      - name: Build and link native reader libraries
        run: |
          chmod +x gradlew
          bash scripts/ci-command.sh bash Builder/ci-native.sh
      - name: Save native libraries independently of later test results
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Builder/mupdf-1.28.5
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Audit network entry points
        run: python3 scripts/check-network-policy.py
      - name: Foliate text geometry regression tests
        run: node --test scripts/tests/*.test.cjs
      - name: Build debug APKs
        run: bash scripts/ci-command.sh ./gradlew assembleDebug --stacktrace
      - name: JVM unit tests
        run: bash scripts/ci-command.sh ./gradlew :app:testFdroidJSDebugUnitTest --stacktrace
      - name: Report JVM test failures
        if: always()
        run: python3 scripts/report-test-failures.py
      - name: Build release APK (CI test key, not a production signing key)
        run: bash scripts/ci-command.sh ./gradlew :app:assembleFdroidJSRelease -PciReleaseSigning --stacktrace
      - name: Upload debug and release APKs
        uses: actions/upload-artifact@v4
        with:
          name: librera-restricted-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/fdroidJS/debug/*-uni.apk
            app/build/outputs/apk/fdroidJS/release/*-uni.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Headless emulator and instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-command.sh ./gradlew :app:connectedFdroidDebugAndroidTest :app:connectedFdroidJSDebugAndroidTest --continue --stacktrace
      - name: Report instrumentation test failures
        if: always()
        run: python3 scripts/report-test-failures.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
