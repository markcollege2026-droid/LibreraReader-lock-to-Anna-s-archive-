name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK (this fork targets Java 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Use the hosted runner's Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.2.12479018'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfreetype-dev libharfbuzz-dev libjpeg-dev libopenjp2-7-dev zlib1g-dev libgumbo-dev libmujs-dev mesa-common-dev libxcursor-dev libxrandr-dev libxinerama-dev libglu1-mesa-dev libxi-dev libgl-dev
      - name: Cache native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: Builder/mupdf-1.28.5
          key: native-linux-ndk27-1.28.5-${{ hashFiles('Builder/jni/**', 'Builder/link_to_mupdf_1.28.5.sh', 'Builder/ci-native.sh') }}
      - name: Build and link native reader libraries
        run: |
          chmod +x gradlew
          bash Builder/ci-native.sh
      - name: Audit network entry points
        run: python3 scripts/check-network-policy.py
      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace
      - name: JVM unit tests
        run: ./gradlew :app:testFdroidJSDebugUnitTest --stacktrace
      - name: Build release APK (CI test key, not a production signing key)
        run: ./gradlew :app:assembleFdroidJSRelease -PciReleaseSigning --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Headless emulator and instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedFdroidJSDebugAndroidTest --stacktrace
      - name: Upload debug and release APKs
        uses: actions/upload-artifact@v4
        with:
          name: librera-restricted-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/fdroidJS/debug/*-uni.apk
            app/build/outputs/apk/fdroidJS/release/*-uni.apk
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
